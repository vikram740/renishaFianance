<div class="confirmationBox notify">
    <h2 mat-dialog-title>Are you sure?</h2>
    <mat-dialog-actions>
        <button class="cancel-btn" mat-dialog-close (click)="onCloseClick()">Close</button>
        <button class="confirm-btn" (click)="onConfirmClick()">Confirm</button>
    </mat-dialog-actions>
</div>
