<div class="forgotPasswordPage">
    <div class="login">
        <div class="forgotPassDiv">
            <label for="">Forget Password</label>
        </div>
        <div>
            <img src="/images/renishaLogo.jpg" alt="" class="img-fluid logo">
        </div>
        <form action="" [formGroup]="forgotPasswordForm" (ngSubmit)="send()">
            <div>
                <div class="labelInputDiv">
                    <label for="" class="fieldLabels">Email</label>
                    <div>
                        <input type="email" placeholder="Enter Your Email" formControlName="email">
                        @if (submitted()) {
                        @if(forgotPasswordForm.get('email')?.hasError('required')){
                        <div class="errMsg">*Email is required</div>
                        }
                        @if(forgotPasswordForm.get('email')?.hasError('pattern')){
                        <div class="errMsg">*Email is invalid</div>
                        }
                        }
                    </div>
                </div>
                <div>
                    <button type="submit" class="signinBtn">Send</button>
                </div>
                <div class="signupDiv">
                    <label for=""><a routerLink="/login">Back to Login</a></label>
                </div>
            </div>
        </form>
    </div>
</div>
